<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruta Segura — Dirección</title>
  <meta name="description" content="Indica la dirección donde necesitas el servicio de asistencia vial.">

  <!-- Google Fonts: Poppins (headings) + Open Sans (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --rs-primary: #0B3954;
      --rs-accent: #087E8B;
      --rs-bg: #F7F7F2;
    }

    body {
      font-family: 'Open Sans', sans-serif;
      background-color: var(--rs-bg);
      color: var(--rs-primary);
      min-height: 100vh;
    }

    h1, h2, h3, .brand-font {
      font-family: 'Poppins', sans-serif;
    }

    /* Full-viewport wrapper that centers the "phone" mockup */
    .stage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .phone-frame {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(11, 57, 84, 0.18);
      overflow: hidden;
      border: 1px solid rgba(11, 57, 84, 0.08);
    }

    .phone-header {
      background: var(--rs-primary);
      color: #fff;
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .back-link {
      color: #fff;
      text-decoration: none;
      font-size: 1.25rem;
      line-height: 1;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      opacity: 0.9;
    }

    .back-link:hover,
    .back-link:focus {
      opacity: 1;
      color: #fff;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--rs-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      color: #fff;
      flex-shrink: 0;
    }

    .phone-header .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ADE80;
      display: inline-block;
      margin-right: 0.35rem;
    }

    .phone-body {
      padding: 1.5rem;
      background: var(--rs-bg);
    }

    /* Chat bubble */
    .chat-bubble {
      background: #fff;
      border-radius: 16px 16px 16px 4px;
      padding: 1rem 1.15rem;
      box-shadow: 0 2px 6px rgba(11, 57, 84, 0.08);
      max-width: 92%;
      animation: fadeInUp 0.5s ease-out;
    }

    .chat-bubble p {
      margin-bottom: 0.5rem;
      line-height: 1.5;
    }

    .chat-bubble p:last-child {
      margin-bottom: 0;
    }

    /* Burbuja del propio usuario (respuesta), alineada a la derecha */
    .chat-bubble-user {
      background: var(--rs-accent);
      color: #fff;
      border-radius: 16px 16px 4px 16px;
      padding: 1rem 1.15rem;
      box-shadow: 0 2px 6px rgba(11, 57, 84, 0.08);
      max-width: 92%;
      margin-left: auto;
      animation: fadeInUp 0.5s ease-out;
    }

    .chat-bubble-user p {
      margin-bottom: 0;
      line-height: 1.5;
    }

    .chat-timestamp {
      font-size: 0.72rem;
      color: #8a97a1;
      margin-top: 0.4rem;
      text-align: right;
    }

    .chat-timestamp-user {
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.75);
      margin-top: 0.4rem;
      text-align: right;
    }

    .form-control {
      border-radius: 12px;
      border: 1px solid rgba(11, 57, 84, 0.2);
      padding: 0.75rem 1rem;
    }

    .form-control:focus {
      border-color: var(--rs-accent);
      box-shadow: 0 0 0 0.2rem rgba(8, 126, 139, 0.15);
    }

    .btn-rs-accent {
      background-color: var(--rs-accent);
      border-color: var(--rs-accent);
      color: #fff;
      font-weight: 600;
      padding: 0.75rem 1rem;
      border-radius: 12px;
    }

    .btn-rs-accent:hover,
    .btn-rs-accent:focus {
      background-color: #066b76;
      border-color: #066b76;
      color: #fff;
    }

    .btn-rs-outline {
      background-color: transparent;
      border: 1px solid rgba(11, 57, 84, 0.25);
      color: var(--rs-primary);
      font-weight: 600;
      padding: 0.75rem 1rem;
      border-radius: 12px;
    }

    .btn-rs-outline:hover,
    .btn-rs-outline:focus {
      background-color: rgba(11, 57, 84, 0.05);
      color: var(--rs-primary);
    }

    .footer-note {
      font-size: 0.75rem;
      color: #6b7a84;
      text-align: center;
    }

    #addressFormSection.d-none,
    #confirmSection.d-none {
      display: none !important;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="stage">
    <main class="phone-frame" aria-label="Pantalla de dirección de Ruta Segura">

      <!-- Header: identidad de marca + regreso a Confirmación de servicio -->
      <header class="phone-header">
        <a href="confirmacion-servicio.html" class="back-link" aria-label="Volver a Confirmación de servicio">&#8592;</a>
        <div class="brand-logo" aria-hidden="true">RS</div>
        <div>
          <h1 class="h6 mb-0 brand-font">Ruta Segura</h1>
          <small><span class="status-dot" aria-hidden="true"></span>Asistencia vial · en línea</small>
        </div>
      </header>

      <!-- Cuerpo: captura y confirmación de dirección, estilo chat -->
      <div class="phone-body">

        <div class="chat-bubble mb-3">
          <p class="mb-0">¿A qué dirección necesitas que llegue el servicio?</p>
          <div class="chat-timestamp">Ruta Segura Bot</div>
        </div>

        <!-- Formulario de dirección -->
        <div id="addressFormSection">
          <form id="addressForm" class="mb-3">
            <div class="mb-3">
              <label for="addressInput" class="form-label visually-hidden">Dirección</label>
              <textarea class="form-control" id="addressInput" rows="2" placeholder="Ej. 5a avenida 10-25, zona 10, Ciudad de Guatemala" required></textarea>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-rs-accent">Enviar dirección</button>
            </div>
          </form>
        </div>

        <!-- Confirmación de la dirección escrita -->
        <div id="confirmSection" class="d-none">
          <div class="chat-bubble-user mb-3">
            <p id="addressEcho"></p>
            <div class="chat-timestamp-user">Tú</div>
          </div>

          <div class="chat-bubble mb-3">
            <p class="mb-0" id="confirmQuestion"></p>
            <div class="chat-timestamp">Ruta Segura Bot</div>
          </div>

          <div class="d-grid gap-2 mb-3">
            <button type="button" class="btn btn-rs-accent" id="confirmYesBtn">Sí</button>
            <button type="button" class="btn btn-rs-outline" id="confirmNoBtn">No</button>
          </div>
        </div>

        <p class="footer-note mb-0">
          Pago por evento · Sin letra pequeña · Un operador confirma tu pago antes de despachar
        </p>

      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    var addressFormSection = document.getElementById('addressFormSection');
    var confirmSection = document.getElementById('confirmSection');
    var addressForm = document.getElementById('addressForm');
    var addressInput = document.getElementById('addressInput');
    var addressEcho = document.getElementById('addressEcho');
    var confirmQuestion = document.getElementById('confirmQuestion');

    addressForm.addEventListener('submit', function (e) {
      e.preventDefault();
      var address = addressInput.value.trim();
      if (!address) { return; }

      addressEcho.textContent = address;
      confirmQuestion.textContent = '¿Estás en ' + address + '?';

      addressFormSection.classList.add('d-none');
      confirmSection.classList.remove('d-none');
      confirmSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });

    document.getElementById('confirmNoBtn').addEventListener('click', function () {
      // Permite reescribir la dirección
      confirmSection.classList.add('d-none');
      addressFormSection.classList.remove('d-none');
      addressInput.focus();
      addressInput.select();
    });

    document.getElementById('confirmYesBtn').addEventListener('click', function () {
      try {
        localStorage.setItem('rs_address', addressEcho.textContent);
      } catch (e) {
        // localStorage no disponible: continuamos igual, la dirección ya se mostró
      }
      window.location.href = 'pago.html';
    });
  </script>
</body>
</html>
